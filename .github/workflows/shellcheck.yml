# ShellCheck ワークフロー
#
# 目的: シェルスクリプトの変更時に ShellCheck を実行し、
# ローカルの pre-commit と同じ品質ゲートを CI でも担保する。

name: ShellCheck

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: Lint shell scripts
    timeout-minutes: 5
    permissions:
      contents: read
    # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
    # mise-action の `mise install --locked` は install_args のツールだけでなく config 上の全ツールを
    # lock へ照合するため、この env が無いと CI で使わない http ツールを解決しにいって落ちる（#859 / #863）。
    # **ジョブ全体に置く**。元の理由は「後段の `mise exec` にも効かせる」ことだったが、その
    # `mise exec` は外した（#917）。今は mise を呼ぶステップが後から増えても取りこぼさないための予防。
    env:
      MISE_ENV: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        # MISE_ENV=ci はジョブの env で与える（理由は上の env ブロックのコメント）。
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # install_args のツール名は mise.toml の [tools] キーと一致させる（lock は backend 修飾名で
          # 同定するため、短縮名 `shellcheck` では --locked が lock エントリを引けず落ちる）。
          install_args: "aqua:koalaman/shellcheck"

      - name: Verify tool version
        run: shellcheck --version

      - name: Run ShellCheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

      # ShellCheck が検出しない形（bash 3.2 が変数参照の直後の非 ASCII 文字を変数名として
      # 食う）を別途検査する（#864）。素の bash / perl で動くのでツールの追加導入は要らない。
      - name: Check shell variable expansion before non-ASCII
        run: scripts/check-shell-brace-expansion.sh
