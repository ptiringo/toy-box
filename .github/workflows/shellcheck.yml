# ShellCheck ワークフロー
#
# 目的: シェルスクリプトの変更時に ShellCheck を実行し、
# ローカルの pre-commit と同じ品質ゲートを CI でも担保する。

name: ShellCheck

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: Lint shell scripts
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        env:
          # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
          MISE_ENV: ci
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # install_args のツール名は mise.toml の [tools] キーと一致させる（lock は backend 修飾名で
          # 同定するため、短縮名 `shellcheck` では --locked が lock エントリを引けず落ちる）。
          install_args: "aqua:koalaman/shellcheck"

      - name: Verify tool version
        run: shellcheck --version

      - name: Run ShellCheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck
