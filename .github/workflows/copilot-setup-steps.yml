name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: &trigger_paths
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths: *trigger_paths

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
    # mise-action の `mise install --locked` は install_args のツールだけでなく config 上の全ツールを
    # lock へ照合するため、この env が無いと CI で使わない http ツールを解決しにいって落ちる（#859 / #863）。
    # **ジョブ全体に置く**。元の理由は「後段の `mise exec` にも効かせる」ことだったが、その
    # `mise exec` は外した（#917）。今は mise を呼ぶステップが後から増えても取りこぼさないための予防。
    # （kotlin-lsp/tfctl は mise が per-platform SHA を mise.lock に永続化せず `mise install --locked`
    # を満たせない。#510 回帰。どちらも Copilot 環境では不要。）
    env:
      MISE_ENV: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        # MISE_ENV=ci はジョブの env で与える（理由は上の env ブロックのコメント）。
        with:
          # `mise install` の代わりに `mise bootstrap` を走らせ、[tools] の導入に続けて
          # `[tasks.bootstrap]`（= lefthook install）まで 1 ステップで流す（#396）。onboarding の
          # 手順を mise.toml 側に寄せ、ワークフローに手書きの lefthook ステップを持たせない。
          # 留意点: bootstrap は実験的機能で、有効化すると action が MISE_EXPERIMENTAL=1 を付与する。
          # install_args とは併用不可だが、本ジョブは元々使っていない（除外は MISE_ENV=ci が担う）。
          # lock ファイルがあるため action は `mise --locked bootstrap` を呼ぶ（install 経路と同じ扱い）。
          bootstrap: true

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      # cache-provider は既定（enhanced）。ここはエージェント環境のキャッシュ warm が役目なので
      # 書き込みを止めない（ADR-0060）。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
