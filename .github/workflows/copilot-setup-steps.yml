name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: &trigger_paths
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths: *trigger_paths

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          # CI 用オーバーレイ mise.ci.toml を読み込み、http backend ツール（kotlin-lsp/tfctl）を
          # インストール対象から外す（mise が per-platform SHA を mise.lock に永続化せず
          # `mise install --locked` を満たせない。#510 回帰。どちらも Copilot 環境では不要）。
          MISE_ENV: ci

      - name: Set up lefthook
        run: lefthook install

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      # cache-provider は既定（enhanced）。ここはエージェント環境のキャッシュ warm が役目なので
      # 書き込みを止めない（ADR-0060）。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
