name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: &trigger_paths
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths: *trigger_paths

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
    # **ジョブ全体に置く**。mise-action のステップにだけ付けると、後段で `mise exec` を使う
    # ステップが素の mise.toml を読み、CI で使わない http ツールを解決しにいって落ちる（#859 / #863）。
    # （kotlin-lsp/tfctl は mise が per-platform SHA を mise.lock に永続化せず `mise install --locked`
    # を満たせない。#510 回帰。どちらも Copilot 環境では不要。）
    env:
      MISE_ENV: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        # MISE_ENV=ci はジョブの env で与える（このステップ限定にすると後段の mise exec に効かない）。
        with:
          # `mise install` の代わりに `mise bootstrap` を走らせ、[tools] の導入に続けて
          # `[tasks.bootstrap]`（= lefthook install）まで 1 ステップで流す（#396）。onboarding の
          # 手順を mise.toml 側に寄せ、ワークフローに手書きの lefthook ステップを持たせない。
          # 留意点: bootstrap は実験的機能で、有効化すると action が MISE_EXPERIMENTAL=1 を付与する。
          # install_args とは併用不可だが、本ジョブは元々使っていない（除外は MISE_ENV=ci が担う）。
          # lock ファイルがあるため action は `mise --locked bootstrap` を呼ぶ（install 経路と同じ扱い）。
          bootstrap: true

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      # cache-provider は既定（enhanced）。ここはエージェント環境のキャッシュ warm が役目なので
      # 書き込みを止めない（ADR-0060）。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
