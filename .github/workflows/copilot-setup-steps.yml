name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: &trigger_paths
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths: *trigger_paths

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        env:
          # CI 用オーバーレイ mise.ci.toml を読み込み、http backend ツール（kotlin-lsp/tfctl）を
          # インストール対象から外す（mise が per-platform SHA を mise.lock に永続化せず
          # `mise install --locked` を満たせない。#510 回帰。どちらも Copilot 環境では不要）。
          MISE_ENV: ci

      - name: Set up lefthook
        run: lefthook install

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      # cache-provider は既定（enhanced）。ここはエージェント環境のキャッシュ warm が役目なので
      # 書き込みを止めない（ADR-0060）。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
