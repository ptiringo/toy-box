# Kotlin/Java コードベースに対して CodeQL セキュリティ分析を実行し、脆弱性を検出します。
name: CodeQL Analysis
run-name: CodeQL Analysis for ${{ github.ref }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # 毎週月曜日の午前9時（JST）に定期実行
    - cron: "0 0 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    name: Analyze Kotlin/Java
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # configuration-cache を runner 間で持ち越す（詳細は api-tests.yml のコメント参照）。
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-cleanup: on-success

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: java-kotlin

      # CodeQL は解析用に production コードがコンパイルできれば十分。
      # assemble は check 配下（test / ktfmt / detekt / koverVerify）を一切呼ばないため、
      # 検証タスクの個別除外が不要で、check に検証が増えてもメンテ不要。
      - name: Build with Gradle
        run: ./gradlew assemble --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:java-kotlin"
