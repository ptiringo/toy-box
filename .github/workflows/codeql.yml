# Kotlin/Java コードベースに対して CodeQL セキュリティ分析を実行し、脆弱性を検出します。
name: CodeQL Analysis
run-name: CodeQL Analysis for ${{ github.ref }}

on:
  workflow_dispatch:
  # `paths` / `paths-ignore` で絞らない。この解析が報告する `CodeQL`（code scanning）は main の
  # required status check なので、絞ると対象外の PR で pending のまま止まる（#819 / ADR-0082）。
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # 毎週月曜日の午前9時（JST）に定期実行
    - cron: "0 0 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    name: Analyze Kotlin/Java
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin

      # CodeQL は解析用に production コードがコンパイルできれば十分。
      # assemble は check 配下（test / ktfmt / detekt / koverVerify）を一切呼ばないため、
      # 検証タスクの個別除外が不要で、check に検証が増えてもメンテ不要。
      #
      # --no-build-cache は必須。CodeQL の extractor は Kotlin/Java コンパイラの実行をトレースして
      # ソースを取り込むため、compileKotlin が build cache から FROM-CACHE で復元されると
      # 「CodeQL could not process any code written in Java/Kotlin」で失敗する（ADR-0060）。
      # 依存キャッシュは setup-gradle 側で効かせたままにし、このビルドの build cache だけを切る。
      - name: Build with Gradle
        run: ./gradlew assemble --no-build-cache --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:java-kotlin"
