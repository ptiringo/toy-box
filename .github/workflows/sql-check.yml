# SQL（Flyway マイグレーション）チェックワークフロー
#
# 目的: マイグレーション SQL の変更時に squawk（安全性）と sqlfluff（書式）を実行し、
# ローカルの pre-commit と同じ品質ゲートを CI でも担保する。

name: SQL Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/main/resources/db/migration/**"
      - ".sqlfluff"
      - ".squawk.toml"
      - "scripts/check-migration-validate-separation.sh"
      # ワークフロー自身を変更した PR でも走らせる（#819。無いと、その変更を CI で確かめられない）。
      - ".github/workflows/sql-check.yml"
  push:
    branches: [main]
    paths:
      - "src/main/resources/db/migration/**"
      - ".sqlfluff"
      - ".squawk.toml"
      - "scripts/check-migration-validate-separation.sh"
      - ".github/workflows/sql-check.yml"
  workflow_dispatch:

jobs:
  sql-check:
    runs-on: ubuntu-latest
    name: SQL Lint and Migration Safety Check
    timeout-minutes: 5
    permissions:
      contents: read
    # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
    # mise-action の `mise install --locked` は install_args のツールだけでなく config 上の全ツールを
    # lock へ照合するため、この env が無いと CI で使わない http ツールを解決しにいって落ちる（#859 / #863）。
    # **ジョブ全体に置く**。元の理由は「後段の `mise exec` にも効かせる」ことだったが、その
    # `mise exec` は外した（#917）。今は mise を呼ぶステップが後から増えても取りこぼさないための予防。
    env:
      MISE_ENV: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        # MISE_ENV=ci はジョブの env で与える（理由は上の env ブロックのコメント）。
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 必要なのは sqlfluff / squawk のみ。他ジョブ用ツールや http backend の
          # kotlin-lsp/tfctl は列挙しないため取得されない（#510 の --locked 問題も回避）。
          # sqlfluff は pipx backend で、インストール時に venv 作成へ uv を要するため uv も併せて入れる
          # （列挙から漏らすと mise が install dependency を解決できずステップごと落ちる。#876）。
          install_args: "pipx:sqlfluff github:sbdchd/squawk uv"

      - name: Verify tool versions
        run: |
          squawk --version
          sqlfluff --version

      - name: sqlfluff lint
        run: sqlfluff lint src/main/resources/db/migration

      - name: squawk migration safety
        run: squawk src/main/resources/db/migration/*.sql

      - name: VALIDATE CONSTRAINT separation check
        run: scripts/check-migration-validate-separation.sh
