# SQL（Flyway マイグレーション）チェックワークフロー
#
# 目的: マイグレーション SQL の変更時に squawk（安全性）と sqlfluff（書式）を実行し、
# ローカルの pre-commit と同じ品質ゲートを CI でも担保する。

name: SQL Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/main/resources/db/migration/**"
      - ".sqlfluff"
      - ".squawk.toml"
      - "scripts/check-migration-validate-separation.sh"
  push:
    branches: [main]
    paths:
      - "src/main/resources/db/migration/**"
      - ".sqlfluff"
      - ".squawk.toml"
      - "scripts/check-migration-validate-separation.sh"
  workflow_dispatch:

jobs:
  sql-check:
    runs-on: ubuntu-latest
    name: SQL Lint and Migration Safety Check
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
          MISE_ENV: ci
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 必要なのは sqlfluff / squawk のみ。他ジョブ用ツールや http backend の
          # kotlin-lsp/tfctl は列挙しないため取得されない（#510 の --locked 問題も回避）。
          install_args: "pipx:sqlfluff github:sbdchd/squawk"

      - name: Verify tool versions
        run: |
          squawk --version
          sqlfluff --version

      - name: sqlfluff lint
        run: sqlfluff lint src/main/resources/db/migration

      - name: squawk migration safety
        run: squawk src/main/resources/db/migration/*.sql

      - name: VALIDATE CONSTRAINT separation check
        run: scripts/check-migration-validate-separation.sh
