# OpenAPI lint ワークフロー（#327 / ADR-0054）
#
# 目的: springdoc が生成する OpenAPI 仕様（build/openapi.json）を vacuum で lint し、
# API ドキュメント品質（記述漏れ・命名の一貫性）のドリフトを CI で防ぐ。
# 生成はアプリの forked bootRun を伴い、datasource は spring-boot-docker-compose が
# compose.yaml の PostgreSQL を供給する（Docker は ubuntu-latest に同梱）。
# 重い（アプリ起動を伴う）ため check / pre-commit には載せず、この独立ワークフローが唯一のゲート。

name: OpenAPI Lint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "src/main/**"
      - "config/vacuum/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "compose.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/openapi-lint.yml"
  push:
    branches: [main]
    paths:
      - "src/main/**"
      - "config/vacuum/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "compose.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/openapi-lint.yml"
  workflow_dispatch:

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    name: vacuum lint
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          # configuration-cache を runner 間で持ち越す（詳細は api-tests.yml のコメント参照）。
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-cleanup: on-success

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        env:
          # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
          MISE_ENV: ci
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 必要なのは vacuum のみ（JDK は setup-java が供給）。
          install_args: "vacuum"

      - name: Verify vacuum
        run: vacuum version

      - name: Generate and lint OpenAPI spec
        run: ./gradlew lintOpenApiDocs --stacktrace
