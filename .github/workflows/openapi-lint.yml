# OpenAPI lint ワークフロー（#327 / ADR-0054）
#
# 目的: springdoc が生成する OpenAPI 仕様（build/openapi.json）を vacuum で lint し、
# API ドキュメント品質（記述漏れ・命名の一貫性）のドリフトを CI で防ぐ。
# 生成はアプリの forked bootRun を伴い、datasource は spring-boot-docker-compose が
# compose.yaml の PostgreSQL を供給する（Docker は ubuntu-latest に同梱）。
# 重い（アプリ起動を伴う）ため check / pre-commit には載せず、この独立ワークフローが唯一のゲート。

name: OpenAPI Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/main/**"
      - "config/vacuum/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "compose.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/openapi-lint.yml"
  push:
    branches: [main]
    paths:
      - "src/main/**"
      - "config/vacuum/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "compose.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/openapi-lint.yml"
  workflow_dispatch:

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    name: vacuum lint
    timeout-minutes: 15
    permissions:
      contents: read
    # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
    # mise-action の `mise install --locked` は install_args のツールだけでなく config 上の全ツールを
    # lock へ照合するため、この env が無いと CI で使わない http ツールを解決しにいって落ちる（#859 / #863）。
    # **ジョブ全体に置く**。元の理由は「後段の `mise exec` にも効かせる」ことだったが、その
    # `mise exec` は外した（#917）。今は mise を呼ぶステップが後から増えても取りこぼさないための予防。
    env:
      MISE_ENV: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        # MISE_ENV=ci はジョブの env で与える（理由は上の env ブロックのコメント）。
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 必要なのは vacuum のみ（JDK は setup-java が供給）。
          install_args: "vacuum"

      - name: Verify vacuum
        run: vacuum version

      - name: Generate and lint OpenAPI spec
        run: ./gradlew lintOpenApiDocs --stacktrace
