# OpenAPI lint ワークフロー（#327 / ADR-0054）
#
# 目的: springdoc が生成する OpenAPI 仕様（build/openapi.json）を vacuum で lint し、
# API ドキュメント品質（記述漏れ・命名の一貫性）のドリフトを CI で防ぐ。
# 生成はアプリの forked bootRun を伴い、datasource は spring-boot-docker-compose が
# compose.yaml の PostgreSQL を供給する（Docker は ubuntu-latest に同梱）。
# 重い（アプリ起動を伴う）ため check / pre-commit には載せず、この独立ワークフローが唯一のゲート。

name: OpenAPI Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/main/**"
      - "config/vacuum/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "compose.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/openapi-lint.yml"
  push:
    branches: [main]
    paths:
      - "src/main/**"
      - "config/vacuum/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "compose.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/openapi-lint.yml"
  workflow_dispatch:

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    name: vacuum lint
    timeout-minutes: 15
    permissions:
      contents: read
    # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
    # **ジョブ全体に置く**。mise-action のステップにだけ付けると、後段で `mise exec` を使う
    # ステップが素の mise.toml を読み、CI で使わない http ツールを解決しにいって落ちる（#859 / #863）。
    env:
      MISE_ENV: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        # MISE_ENV=ci はジョブの env で与える（このステップ限定にすると後段の mise exec に効かない）。
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 必要なのは vacuum のみ（JDK は setup-java が供給）。
          install_args: "vacuum"

      - name: Verify vacuum
        run: vacuum version

      - name: Generate and lint OpenAPI spec
        run: ./gradlew lintOpenApiDocs --stacktrace
