# Pull Request 時にテストと ktfmt チェックを自動実行し、mainブランチへの壊れたコードのマージを防止します。
name: API Tests
run-name: API Tests for ${{ github.ref }}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run API Tests
    timeout-minutes: 15
    permissions:
      contents: read
    # http backend ツール（kotlin-lsp / tfctl）を config から外す（mise.ci.toml。#510）。
    # **ジョブ全体に置く**。mise-action のステップにだけ付けると、後段で `mise exec` を使う
    # ステップが素の mise.toml を読み、CI で使わない http ツールまで解決しにいく。実際に
    # kotlin-lsp の配布物が上流から消えた 2026-08-30、差分カバレッジのステップだけが 404 で
    # 落ちた（#859。この env はそのステップに届いていなかった）。
    env:
      MISE_ENV: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        # cache-provider は既定（enhanced）。Gradle User Home（依存の modules-2、スクリプトコンパイル結果の
        # kotlin-dsl、ローカル build cache の build-cache-1 等）を runner 間に持ち越す。
        # gradle.properties の org.gradle.caching=true と組み合わせ、PR では読み取り・main では
        # 書き込み（setup-gradle 既定）で compile/test 出力を再利用する（#349）。
        # basic は restore key を使わずキー完全一致時は保存をスキップするため採用しない（ADR-0060）。
        # configuration cache（org.gradle.configuration-cache=true）は runner 間で持ち越せない。
        # setup-gradle の project-state キャッシュは Develocity 資格情報を要する beta 機能のため
        # cache-encryption-key だけでは有効にならない（ADR-0060 で実測・不採用）。
        # cache-cleanup は既定が on-success なので明示しない。
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # MISE_ENV=ci はジョブの env で与える（このステップ限定にすると後段の mise exec に効かない）。
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 使うのは patch coverage 用の diff-cover のみ（JDK/Gradle は setup-java / setup-gradle が供給）。
          # diff-cover は pipx backend で、インストール時に venv 作成へ uv を要するため uv も併せて入れる。
          install_args: "pipx:diff-cover uv"

      - name: Run ktfmt check
        run: ./gradlew ktfmtCheck --stacktrace

      # コンパイラ警告をエラー化するゲート（allWarningsAsErrors, ADR-0019）。
      # detekt / test 内のコンパイルでも効くが、警告で落ちたとき原因が明確になるよう専用ステップで明示する。
      - name: Compile (warnings as errors)
        run: ./gradlew compileKotlin compileTestKotlin :detekt-rules:compileKotlin :detekt-rules:compileTestKotlin --stacktrace

      - name: Run detekt
        run: ./gradlew detekt --stacktrace

      - name: Run API tests
        run: ./gradlew test --stacktrace

      # 成熟パッケージの行カバレッジ下限（ラチェット）を検証する。下回るとここで失敗する。
      - name: Verify coverage gate
        run: ./gradlew koverVerifyMature --stacktrace

      # 変更行カバレッジ（patch coverage）ゲート。PR で触った行の 90% 未満で落とす(#437, ADR-0055)。
      # 探索領域(denylist)は mature XML に載らないため分母から自動で外れる。
      - name: Verify patch coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ./gradlew koverXmlReportMature --stacktrace
          mise exec -- diff-cover build/reports/kover/reportMature.xml \
            --compare-branch "origin/$BASE_REF" \
            --src-roots src/main/kotlin \
            --fail-under 90 \
            --markdown-report diff-cover.md

      # 変更行カバレッジの Markdown を Job Summary に出す（落ちても見えるよう always()）。
      - name: Report patch coverage
        if: always() && github.event_name == 'pull_request'
        run: |
          {
            echo '## 🎯 差分カバレッジ（変更行）'
            echo ''
            cat diff-cover.md 2>/dev/null || echo '（レポートなし）'
          } >> "$GITHUB_STEP_SUMMARY"

      # 全体／成熟ゲートの行カバレッジを PR の Job Summary に出す（外部サービス不要）。
      # ゲートが落ちても数値が見えるよう always() で実行する。
      - name: Report coverage
        if: always()
        run: |
          {
            echo '## 🧪 テストカバレッジ'
            echo ''
            ./gradlew koverLog koverLogMature --console=plain 2>&1 \
              | grep 'カバレッジ' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
