# Pull Request / main push 時にブラックボックス API E2E テスト（RestTestClient）を独立ジョブで実行する。
# 既存「API Tests」(api-tests.yml＝ユニット/slice ゲート) とは分離し、遅い E2E を内側ループから切り離す。
name: E2E API Tests
run-name: E2E API Tests for ${{ github.ref }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run E2E tests
        run: ./gradlew e2eTest --stacktrace
