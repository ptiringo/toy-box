# Pull Request / main push 時にブラックボックス API E2E テスト（RestTestClient）を独立ジョブで実行する。
# 既存「API Tests」(api-tests.yml＝ユニット/slice ゲート) とは分離し、遅い E2E を内側ループから切り離す。
name: E2E API Tests
run-name: E2E API Tests for ${{ github.ref }}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    # ドキュメント・Claude 指示・インフラだけの変更では走らせない（#819 / ADR-0082）。
    # 除外集合は browser-e2e / container-smoke-test と揃える。`E2E` は main の required status
    # check ではないので絞れる（required のものを絞ると、起動しない PR で pending のまま止まる）。
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "infra/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "infra/**"

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run E2E tests
        run: ./gradlew e2eTest --stacktrace
