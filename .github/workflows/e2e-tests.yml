# Pull Request / main push 時にブラックボックス API E2E テスト（RestTestClient）を独立ジョブで実行する。
# 既存「API Tests」(api-tests.yml＝ユニット/slice ゲート) とは分離し、遅い E2E を内側ループから切り離す。
name: E2E API Tests
run-name: E2E API Tests for ${{ github.ref }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Run E2E tests
        run: ./gradlew e2eTest --stacktrace
