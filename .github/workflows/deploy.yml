# mainブランチへのマージ時にDockerイメージをビルドし、Cloud Runにデプロイします。
name: Deploy API
run-name: Deploy API from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloud Run
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write # WIFに必要

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      # デプロイ用ワークフローでは cache poisoning（PR 由来の汚染キャッシュ経由で
      # 成果物が改竄されるリスク）を避けるためキャッシュを無効化する。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/${{ vars.WIF_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/my-repo"
          service_account: "deployer@ptiringo-toy-box.iam.gserviceaccount.com"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # `${{ }}` をシェルスクリプトへ直接展開するとテンプレートインジェクションの
      # 恐れがあるため、環境変数を経由して参照する。
      - name: Build Docker image with bootBuildImage
        env:
          IMAGE: ${{ vars.IMAGE }}
        run: ./gradlew bootBuildImage --imageName="${IMAGE}:${GITHUB_SHA}"

      - name: Push Docker image
        env:
          IMAGE: ${{ vars.IMAGE }}
        run: |
          docker tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      # --memory: container-smoke-test.yml の docker run -m と揃えること。
      # gcloud の `--memory=1Gi` は 1 GiB (= 1024 MiB) を表し、docker の `-m 1g` と等価。
      # 単位表記が異なるため、片方だけを更新しないよう注意する。
      #
      # secrets: datasource（Prisma Postgres・#451 / ADR-0044）の接続情報を Secret Manager から
      # 環境変数 SPRING_DATASOURCE_* として注入する。secret の実体は Terraform 管理
      # （infra/modules/prisma-postgres/）で、値は provider の direct_* 属性から自動配線される。
      # api-runner SA には当該 secret の secretAccessor が付与済み。
      # secrets_update_strategy=overwrite: 本ワークフローをサービスの secret 配線の唯一の出所とし、
      # ここに列挙しない secret 配線はデプロイ時に取り除く（宣言的・削除追従）。
      #
      # env_vars: GCP_PROJECT_ID は OAuth2 リソースサーバの issuer / audience を組み立てるために要る
      # （ADR-0064）。プロジェクト ID は秘密ではないが、値はコードに直書きせず production 環境の
      # リポジトリ変数（vars.GCP_PROJECT_ID）から供給する（IMAGE / WIF_PROJECT_NUMBER と同じ流儀）。
      # 注入されないと application.yml の既定値（実在しないプロジェクト ID）に落ち、全トークンが 401 になる。
      # env_vars_update_strategy も secrets と同じく overwrite で、本ワークフローを唯一の出所とする。
      #
      # --execution-environment=gen2: 実行環境を第2世代（フル Linux 互換）に明示固定する。
      # 未指定（Cloud Run の自動選択）だと gen1（gVisor）が選ばれることがあり、外部 DB
      # （Prisma Postgres）への接続時に JVM の DNS 解決が UnknownHostException で失敗した
      # （#451 Phase D cutover 初回失敗の原因。Cloud Run Job=常時 gen2 の latency probe では
      # 同一ホストへ接続できていた）。
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: api
          region: asia-northeast1
          image: ${{ vars.IMAGE }}:${{ github.sha }}
          secrets: |-
            SPRING_DATASOURCE_URL=spring-datasource-url:latest
            SPRING_DATASOURCE_USERNAME=spring-datasource-username:latest
            SPRING_DATASOURCE_PASSWORD=spring-datasource-password:latest
          secrets_update_strategy: overwrite
          env_vars: |-
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
          env_vars_update_strategy: overwrite
          flags: "--service-account=api-runner@ptiringo-toy-box.iam.gserviceaccount.com --no-allow-unauthenticated --port=8080 --memory=1Gi --cpu=1 --cpu-boost --min-instances=0 --max-instances=3 --execution-environment=gen2"
