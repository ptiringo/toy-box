# frontend（Vite + React + TS）の lint/build/test ワークフロー
#
# 目的: frontend/ の変更時に Biome lint・tsc 型チェック込みビルド・vitest を実行し、
# ローカルの pre-commit（biome-frontend）と合わせて frontend の品質ゲートを CI でも担保する。
# Node のバージョンは mise.toml が単一の出所（mise-action が toolchain を供給。ADR-0064 とは無関係）。

name: frontend

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Lint, build and test frontend
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
    # **ジョブ全体に置く**。mise-action のステップにだけ付けると、後段で `mise exec` を使う
    # ステップが素の mise.toml を読み、CI で使わない http ツールを解決しにいって落ちる（#859 / #863）。
    env:
      MISE_ENV: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        # MISE_ENV=ci はジョブの env で与える（このステップ限定にすると後段の mise exec に効かない）。
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # install_args のツール名は mise.toml の [tools] キーと一致させる（lock は backend 修飾名で
          # 同定するため、短縮名では --locked が lock エントリを引けず落ちる。node はそのままのキー）。
          install_args: "node"

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npm run lint

      - name: Build (tsc + vite build)
        run: npm run build

      - name: Run tests
        run: npm run test
