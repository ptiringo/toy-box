# frontend のブラウザ E2E（#725）。ログイン → 世界作成 → 馬一覧を実ブラウザで通す。
#
# Firebase Auth Emulator が発行する未署名 ID トークンを、bootTestRun（test runtime classpath で
# アプリを起動する Gradle タスク）経由のテスト専用 JwtDecoder が受理する構成。本番成果物には
# 手を入れていない。GCP への到達性も資格情報も要らず、ジョブ内で自己完結する。
#
# paths を frontend/** に絞らないのは意図的。#705 のようにバックエンドが API のパスを変えると
# フロントが壊れるため、バックエンドだけの変更でも回す必要がある。
name: Browser E2E
run-name: Browser E2E for ${{ github.ref }}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**/*.md"

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    name: Browser E2E
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        env:
          MISE_ENV: ci
        with:
          install_args: "node"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # chromium は約 300MB あり、キャッシュしないと毎回ダウンロードが乗る（Task 5 の実測申し送り）。
      # キーは package-lock.json の hash（Playwright のバージョンはここに固定されている）。
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      # キャッシュヒット時も OS 依存ライブラリ（--with-deps）は入れ直す必要があるため deps だけ実行する。
      - name: Install Playwright browser
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: frontend
        env:
          # 式をシェルへ直接展開しない（zizmor の template-injection 対策。env 経由なら値として渡るだけで、
          # 攻撃者が制御しうる文字列がコードとして解釈される余地がない）。
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}

      # webServer（playwright.config.ts）の 300 秒には Gradle の構成・コンパイルと postgres イメージの
      # pull まで含まれる。cold runner でそこを丸ごと背負うと 1 回超えただけでジョブが赤くなる
      # （webServer の起動失敗は global setup の失敗であり、retries の対象にならない）。
      # 重い前準備をここへ出すことでタイムアウトの余裕を確保し、ログ上でも
      # 「ビルドが遅いのか E2E が遅いのか」を切り分けられるようにする。
      - name: Warm up Gradle build
        run: ./gradlew testClasses

      - name: Pre-pull PostgreSQL image
        run: docker compose pull

      - name: Run browser E2E
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # playwright.config.ts の webServer が docker compose up した PostgreSQL は、Playwright の
      # 終了後も残る（Task 5 の実測申し送り）。ジョブが落ちても確実に片づける。
      - name: Tear down PostgreSQL
        if: always()
        run: docker compose down -v
