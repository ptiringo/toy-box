# DB スキーマドキュメント（tbls）チェックワークフロー（#447）
#
# 目的: マイグレーション・.tbls.yml・dbdoc・生成ロジックの変更時に checkDbDoc を実行し、
# dbdoc/ の鮮度（tbls diff）とコメント規約（tbls lint）のドリフトを CI で防ぐ。
# Testcontainers で PostgreSQL を起動するため Docker が要る（ubuntu-latest に同梱）。

name: DB Doc Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/main/resources/db/migration/**"
      - ".tbls.yml"
      - "dbdoc/**"
      - "src/dbdoc/**"
      - "build.gradle.kts"
      - "mise.toml"
      - "mise.lock"
      # ワークフロー自身を変更した PR でも走らせる（#819。無いと、その変更を CI で確かめられない）。
      # この 1 行だけは pre-push の glob に対応を持たない（ローカルの checkDbDoc はワークフロー
      # 定義を検証しないため）。CI と pre-push の集合の二重管理そのものは #920。
      - ".github/workflows/db-doc-check.yml"
  push:
    branches: [main]
    paths:
      - "src/main/resources/db/migration/**"
      - ".tbls.yml"
      - "dbdoc/**"
      - "src/dbdoc/**"
      - "build.gradle.kts"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/db-doc-check.yml"
  workflow_dispatch:

jobs:
  db-doc-check:
    runs-on: ubuntu-latest
    name: tbls diff and lint
    timeout-minutes: 15
    permissions:
      contents: read
    # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
    # mise-action の `mise install --locked` は install_args のツールだけでなく config 上の全ツールを
    # lock へ照合するため、この env が無いと CI で使わない http ツールを解決しにいって落ちる（#859 / #863）。
    # **ジョブ全体に置く**。元の理由は「後段の `mise exec` にも効かせる」ことだったが、その
    # `mise exec` は外した（#917）。今は mise を呼ぶステップが後から増えても取りこぼさないための予防。
    env:
      MISE_ENV: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: ".java-version"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        # MISE_ENV=ci はジョブの env で与える（理由は上の env ブロックのコメント）。
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 必要なのは tbls のみ（JDK は setup-java が供給）。
          install_args: "aqua:k1LoW/tbls"

      - name: Verify tbls
        run: tbls version

      - name: Check DB doc drift and lint
        run: ./gradlew checkDbDoc --stacktrace
