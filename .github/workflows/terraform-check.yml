# Terraform検証およびフォーマットチェックワークフロー
#
# 目的: プルリクエストおよびプッシュ時に自動的にterraform validateとフォーマットチェックを実行し、
# Terraform設定の品質と一貫したフォーマットを確保する。

name: Terraform Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "infra/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: infra

jobs:
  terraform-check:
    runs-on: ubuntu-latest
    name: Terraform Validation and Format Check
    timeout-minutes: 5
    permissions:
      contents: read
      # Trivy の SARIF を Code Scanning へアップロードするために必要（ADR-0017 / #378）。
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        env:
          # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
          MISE_ENV: ci
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 必要なのは terraform / tflint / trivy のみ。http backend の kotlin-lsp/tfctl も
          # 列挙しないため取得されない（#510 の --locked 問題も回避）。
          install_args: "terraform tflint aqua:aquasecurity/trivy"

      - name: Verify Terraform version
        run: terraform version

      - name: Initialize Terraform
        # -backend=false フラグは、CI上でバックエンド設定を無視し、プロバイダーのみを初期化するために使用しています。
        # これにより、リモートステートへのアクセス不要でvalidateやfmt等のチェックが可能です。
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validation
        run: terraform validate

      # tflint による lint（ADR-0017 / #377 フェーズ1: recommended preset、--init 不要）。
      # mise 管理の tflint を使う。GCP ruleset を足すフェーズ2 で --init + キャッシュを導入する。
      - name: Run tflint
        run: tflint --recursive

      # Trivy による IaC セキュリティ misconfig スキャン（ADR-0017 / #378）。
      # findings があれば --exit-code 1 で job を落とす hard gate。SARIF は生成後に exit するため、
      # 後段の upload は if: always() で必ず実行する。working-directory: infra なので出力は infra/trivy.sarif。
      - name: Run Trivy IaC scan
        run: trivy config . --format sarif --output trivy.sarif --exit-code 1

      # SARIF を Code Scanning へアップロード（codeql.yml と同じ pin を流用）。
      # uses ステップは working-directory の影響を受けずリポジトリ root から走るため、
      # sarif_file は root 相対の infra/trivy.sarif。category で CodeQL と区別する。
      - name: Upload Trivy SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: infra/trivy.sarif
          category: trivy-iac
