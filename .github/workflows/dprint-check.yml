# dprint による設定ファイル（TOML/JSON/YAML）整形チェックワークフロー
#
# 目的: 設定ファイルの変更時に dprint check を実行し、ローカルの pre-commit と同じ
# 整形ゲートを CI でも担保する（ADR-0063 / #328）。

name: dprint Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.toml"
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.yml"
      - "**/*.yaml"
      - "dprint.json"
  push:
    branches: [main]
    paths:
      - "**/*.toml"
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.yml"
      - "**/*.yaml"
      - "dprint.json"
  workflow_dispatch:

jobs:
  dprint-check:
    runs-on: ubuntu-latest
    name: dprint Format Check
    timeout-minutes: 5
    permissions:
      contents: read
    # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
    # **ジョブ全体に置く**。mise-action のステップにだけ付けると、後段で `mise exec` を使う
    # ステップが素の mise.toml を読み、CI で使わない http ツールを解決しにいって落ちる（#859 / #863）。
    env:
      MISE_ENV: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        # MISE_ENV=ci はジョブの env で与える（このステップ限定にすると後段の mise exec に効かない）。
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 必要なのは dprint のみ。
          install_args: "aqua:dprint/dprint"

      - name: Verify dprint version
        run: dprint --version

      # --diff-format unified: 失敗ログをそのままパッチとして読める・貼れる形にする（#874）。
      # 既定形式は行番号と空白可視化（`·`）が混ざり、Actions のログ上では読み解きに手間がかかる。
      # ローカルの pre-commit（lefthook.yml の dprint）は既定のままにする（用途が違う。理由は
      # lefthook.yml 側のコメント）。0.55.1 以前は `--diff-format` を受け付けない（引数エラーで
      # exit 10）ため、mise.toml の 0.57.0 追従とセットで初めて成立する。
      - name: dprint check
        run: dprint check --diff-format unified
