# dprint による設定ファイル（TOML/JSON/YAML）整形チェックワークフロー
#
# 目的: 設定ファイルの変更時に dprint check を実行し、ローカルの pre-commit と同じ
# 整形ゲートを CI でも担保する（ADR-0063 / #328）。

name: dprint Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.toml"
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.yml"
      - "**/*.yaml"
      - "dprint.json"
  push:
    branches: [main]
    paths:
      - "**/*.toml"
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.yml"
      - "**/*.yaml"
      - "dprint.json"
  workflow_dispatch:

jobs:
  dprint-check:
    runs-on: ubuntu-latest
    name: dprint Format Check
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        env:
          # http backend ツール（kotlin-lsp/tfctl）を config から外す（mise.ci.toml。#510）。
          MISE_ENV: ci
        with:
          # このジョブが使うツールだけを入れる（#464。バージョンの出所は mise.toml）。
          # 必要なのは dprint のみ。
          install_args: "aqua:dprint/dprint"

      - name: Verify dprint version
        run: dprint --version

      - name: dprint check
        run: dprint check
