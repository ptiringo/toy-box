version: 2
# グルーピング方針（#381）:
# - minor / patch の低リスク更新はエコシステムごとに 1 グループへ束ね、PR ノイズを削減する。
# - major 更新はグループから外し個別 PR に残す（破壊的変更をまとめてレビューを難しくしない）。
# - 例外的に高リスク・手作業を伴う依存（Spring Boot / Kotlin プラグイン）は個別・専用グループに分離する。
#
# cooldown 方針（#716）:
# - リリース直後の欠陥版を掴むリスクと、短命なパッチの往復 PR を減らすため、全 4 エコシステムに揃えて置く。
#   cooldown は version update 専用で security update には効かないため、延ばしても脆弱性修正は遅れない。
# - 未設定でも version update には既定 3 日の cooldown がかかる。ここでの上乗せは major / minor のみで、
#   patch は semver-patch-days を書かず既定 3 日のままにする（小さな修正まで待たせない）。
# - semver-major-days / semver-minor-days は SemVer 対応マネージャ限定で、gradle と npm でしか使えない。
#   github-actions / terraform は粒度を指定できないため default-days で一律に置く（minor 相当の 7 日）。
updates:
  # Enable updates for Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep PRs manageable by limiting the number of open PRs
    open-pull-requests-limit: 5
    # major は破壊的変更と初期パッチが出やすいので長め、minor は中間、patch は既定 3 日（方針は先頭コメント）。
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
    groups:
      # Kotlin コンパイラ版と歩調を揃える必要がある依存を 1 グループに束ね、一般グループ
      # （gradle-minor-patch）を軽く緑に保つ。以下は常に同一 PR で足並みを揃える:
      # - kotlin.jvm / kotlin.plugin.spring / kotlin.plugin.power-assert:
      #   3 プラグインは version catalog で version.ref = "kotlin" を共有し、同じ kotlin 行を書き換える。
      #   別グループに散らすと同一 1 行を書く重複 PR が量産される（#242/#245/#575 の実績）。
      # - detekt: detekt は Kotlin コンパイラを埋め込み、「compiled with Kotlin X / running with Y」の
      #   実行時一致を要求する。Kotlin と別 PR にすると双方が単独では緑にならないデッドロックになる
      #   （Kotlin 単独 → detekt 非互換で :detekt 失敗 / detekt 単独 → 同じく失敗）。
      kotlin:
        patterns:
          - "org.jetbrains.kotlin.jvm"
          - "org.jetbrains.kotlin.plugin.spring"
          - "org.jetbrains.kotlin.plugin.power-assert"
          - "dev.detekt"
      # 残りの minor / patch を集約。Spring Boot は Spring 管理 BOM を巻き込むため個別（除外）、
      # Kotlin ロックステップ依存（kotlin プラグイン群 + detekt）は上の専用グループへ回す（除外）。
      # major も個別 PR に残る。
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot"
          - "org.jetbrains.kotlin.jvm"
          - "org.jetbrains.kotlin.plugin.spring"
          - "org.jetbrains.kotlin.plugin.power-assert"
          - "dev.detekt"

  # Enable updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keep PRs manageable by limiting the number of open PRs
    open-pull-requests-limit: 5
    # github-actions は SemVer 粒度の cooldown 非対応（バンプ種別を区別できない）。一律 7 日で置く。
    cooldown:
      default-days: 7
    groups:
      # codeql-action の init / analyze / upload-sarif はバージョン完全一致が必須。
      # 分割更新すると "Loaded a configuration file for version X, but running version Y" で
      # CI が壊れる（#560）。major も含め全 update-type で常に束ね、齟齬を構造的に防ぐ。
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # 残りの Actions の minor / patch を集約。major は個別 PR に残る。
      # codeql-action はグループ定義順で先勝ちのため、このグループには入らない。
      github-actions:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Enable updates for frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # gradle と同じ粒度。react-router 7.18.0 の直後に 7.18.1 / 7.18.2 が出た実例（#693）が動機。
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
    groups:
      # React 本体と型定義はバージョン系列を揃える必要がある（react 19 に上げて @types/react が
      # 18 のままだと型エラーになる）。react / react-dom / それぞれの @types を major も含め
      # 常に 1 PR へ束ね、片側だけ進む状態を作らない。
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # 残りの minor / patch を集約。react 系（上のグループ）はグループ定義順で先勝ちのため
      # ここには入らない。major は個別 PR に残る。
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Enable updates for Terraform providers
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # terraform も SemVer 粒度の cooldown 非対応。github-actions と揃えて一律 7 日で置く。
    cooldown:
      default-days: 7
    groups:
      # /infra は実質 hashicorp/google 単一プロバイダ。minor / patch を集約、major は個別 PR に残る。
      terraform:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
