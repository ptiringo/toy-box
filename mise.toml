[settings]
lockfile = true

# ローカルの GCP アクセスを read-only の「最小抵抗の既定」にする（#475 / ADR-0036）。
# ローカル identity（owner）のまま叩くと変更操作まで通ってしまうため、プロジェクトディレクトリに
# いる間は viewer SA（roles/viewer のみ）への impersonation を既定にし、覚えていなくても
# read-only で動くようにする。対話シェル（mise activate）と Claude Code セッション
# （.claude/hooks/session-start-mise.sh の `mise hook-env`）の双方に適用される。
#
# これは「強制」ではなく既定であって、owner は常に回避できる（ハード強制は不可）。無確認の変更操作を
# 実際に止めるのは .claude/settings.json の permissions（deny/ask）で、本設定はその多層防御
# ＋事故防止。運用・昇格手順は .claude/rules/gcp-guardrails.md を参照。
#
# 前提: local-readonly SA が apply 済みで、利用者に roles/iam.serviceAccountTokenCreator が
# 付いていること（infra/modules/local-readonly/ と HCP の local_readonly_impersonators）。
# 付与前にこの env を有効化すると impersonation が解決できず、読み取りを含む全 gcloud が壊れる。
#
# CI では効かせる必要がない: deploy.yml は mise を経由せず WIF + deployer@ で認証し、
# terraform-check.yml は `terraform init -backend=false` + validate/fmt なので provider 認証を
# 行わない。将来 mise 経由の CI ジョブで gcloud / terraform apply を使うなら、そのジョブで
# 明示的に空へ上書きすること（さもないと viewer 権限で失敗する）。
[env]
# gcloud CLI（--impersonate-service-account の既定値に相当）
CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT = "local-readonly@ptiringo-toy-box.iam.gserviceaccount.com"
# terraform の google / google-beta provider（provider ブロックの impersonate_service_account に相当）。
# infra/ は HCP Terraform（cloud ブロック）で remote 実行されるためこの env は HCP の run には渡らない。
# provider がローカルで認証する場合のみ効く多層防御。
GOOGLE_IMPERSONATE_SERVICE_ACCOUNT = "local-readonly@ptiringo-toy-box.iam.gserviceaccount.com"

[tools]
actionlint = "1.7.12"
"aqua:cli/cli" = "2.96.0"
editorconfig-checker = "3.7.0"
fnox = "1.27.1"
"github:sbdchd/squawk" = "2.58.0"
gitleaks = "8.30.1"
java = "temurin-25.0.3+9.0.LTS"
lefthook = "2.1.9"
# npm 自体も node とは別に固定する（#786）。node 22 同梱の npm 10 は optional 依存の `libc` メタデータを
# 書き出さないため、npm 11 以降が書いた `frontend/package-lock.json` を手元で更新すると、本題と無関係な
# `libc` の削除が巻き添えで入る。Dependabot は新しい npm で lock を書くので、固定しないと
# 「手で触ると消える → Dependabot が足す」の往復差分がレビューのたびに混ざる（PR #785 で直した直後、
# c6d9877 で再び 4 箇所が消えた）。
#
# 実測: 同じ package.json から生成した lock の `libc` は npm 10 で 0 件、npm 11 / 12 で 14 件。
# npm 11 と 12 の出力はバイト単位で一致するため、Dependabot が 11 系のままでも 12 で揃う。
#
# CI の install_args には足していない。frontend / browser-e2e のジョブは `npm ci`（lock を書き換えない）
# しか使わず node 同梱の npm で足りるので、「そのジョブが使うツールだけ入れる」方針（#464）を優先する。
#
# **`node` より前に書くこと**。mise は [tools] の宣言順に PATH を積むため、node の後ろに置くと node 同梱の
# npm 10 が先に解決され、この固定は無言で効かなくなる（`mise exec -- npm --version` が 10.9.8 を返すのを実測）。
"npm:npm" = "12.0.2"
node = "22"
"aqua:koalaman/shellcheck" = "0.11.0"
"pipx:diff-cover" = "10.3.0"
"pipx:sqlfluff" = "4.2.2"
"aqua:k1LoW/tbls" = "1.94.5"
terraform = "1.15.6"
tflint = "0.63.1"
"aqua:aquasecurity/trivy" = "0.71.2"
"aqua:dprint/dprint" = "0.55.1"
uv = "0.11.24"
vacuum = "0.29.9"
zizmor = "1.26.1"

# `mise bootstrap` の最終段で実行される特別扱いのタスク（mise が名前 `bootstrap` で拾う）。
# ツール導入（[tools]）と git フック設定を 1 アクションに束ね、onboarding を `mise bootstrap` 一本に
# 揃える（従来の `mise install` + `lefthook install` の二段手順を廃止。#396）。
# lefthook install は冪等なので、既にフック設定済みの環境で再実行しても安全。
[tasks.bootstrap]
description = "git フック（lefthook）を設定する"
run = "lefthook install"

# tfctl: HCP Terraform / TFE 管理 CLI（run / variable / workspace 操作）。採否は ADR-0034 参照。
# mise registry の短名 `tfctl` は別物（flux-iac/tofu-controller の tfctl）と衝突し、aqua-registry にも
# 未登録・GitHub Releases にバイナリ資産なし（HashiCorp は releases.hashicorp.com で配布）のため、
# registry / aqua / ubi いずれの経路も使えない。よって http バックエンドで releases.hashicorp.com を
# 直接指す。バージョン更新は version フィールド 1 箇所のみ（URL は {{version}} テンプレート）、整合性は
# mise.lock（lockfile=true）が SHA256 で担保する。
[tools."http:tfctl"]
version = "0.4.0"
bin = "tfctl"

# checksum は公式 SHA256SUMS（releases.hashicorp.com/tfctl/<version>/tfctl_<version>_SHA256SUMS）の値を固定する。
# http バックエンドは aqua/ubi と異なり mise.lock に per-platform SHA を埋めないため、ここで明示して整合性を担保する。
# バージョン更新時は version と 4 つの checksum を SHA256SUMS から更新すること。mise.lock 側は
# `mise install` しても自ホスト分しか書き換わらないため、6 エントリ（linux の -musl 派生を含む）を
# `mise lock --platform linux-x64,linux-arm64,linux-x64-musl,linux-arm64-musl,macos-x64,macos-arm64 "http:tfctl"`
# で揃える（platform 間で options が揃っているツールなので、このコマンドは冪等に働く。#762 で実測）。
[tools."http:tfctl".platforms.macos-x64]
url = "https://releases.hashicorp.com/tfctl/{{version}}/tfctl_{{version}}_darwin_amd64.zip"
checksum = "sha256:19786ebddb3cbd922402d21577e85842385910a666e62b1f9b0de46520c527d7"

[tools."http:tfctl".platforms.macos-arm64]
url = "https://releases.hashicorp.com/tfctl/{{version}}/tfctl_{{version}}_darwin_arm64.zip"
checksum = "sha256:e53f2b965eec2435d5543ff4b6ff799b4beac0e0c233a3a355158abe4c524632"

[tools."http:tfctl".platforms.linux-x64]
url = "https://releases.hashicorp.com/tfctl/{{version}}/tfctl_{{version}}_linux_amd64.zip"
checksum = "sha256:055d365cf165708dd304747f27a7242c51ce61a0bf680bd83fd3abe7cbcaa356"

[tools."http:tfctl".platforms.linux-arm64]
url = "https://releases.hashicorp.com/tfctl/{{version}}/tfctl_{{version}}_linux_arm64.zip"
checksum = "sha256:5f2caf7900b8f43dd72f390b992bafceab4ae85bbc58b60325bb1888ef9a0e53"

# kotlin-lsp: JetBrains 公式 Kotlin Language Server。Claude Code の `kotlin-lsp@claude-plugins-official`
# プラグイン（.claude/settings.json で有効化）が要求するバイナリで、PATH 上の `kotlin-lsp --stdio` を起動する。
# 役割は「編集時のリアルタイム診断・コードナビ」で、detekt / ArchUnit / gradle check（stop hook）等のゲートは
# 置き換えない補助操舵。採否・設計は ADR-0046 参照。
#
# 供給経路: JetBrains 公式配布は download-cdn.jetbrains.com（GitHub Releases に資産なし → ubi / aqua 不可、
# 公式 brew tap は macOS 限定）。クロスプラットフォーム再現性を保つため tfctl と同様に http バックエンドで
# 直接指す。mac は `.sit`（実体は zip なので `format = "zip"` で明示）、Linux は `.tar.gz`。
# 版は JetBrains ビルド番号（例 262.8190.0）。更新の手順は下の「バージョン更新時」を参照。
#
# checksum は公式 <asset>.sha256（同 URL に `.sha256` を付けたファイル）の値を固定する。http バックエンドは
# aqua / ubi と異なり mise.lock に per-platform SHA を埋めないため、ここで明示して整合性を担保する。
# strip_components=1 で version 付きトップディレクトリ（kotlin-server-<version>/）を剥がし、その直下の
# ランチャ `kotlin-lsp.sh` を rename_exe でコマンド名 `kotlin-lsp` として PATH に出す。
#
# **`format = "zip"` は外せない**（#762 で実測）。`.sit` は実体こそ zip だが mise は拡張子から
# それを推論しない。指定を外して再インストールすると、mise はアーカイブを展開せず 389MB の `.sit`
# をそのまま `kotlin-lsp` にリネームしたうえで「✓ installed」と表示する。エラーは出ないので、
# 壊れたバイナリが無言で PATH に載る。JetBrains は macOS 用の `.zip` を配布していない（404）ので、
# 配布形式を揃えて回避する道も無い。
#
# この「macOS だけ options が違う」状態が mise.lock を汚す。lock の options はツール単位
# （[tools.<tool>.options]）でしか表現できないため、mise は 1 エントリに収められず、`mise install`
# のたびに lock を書き換える。これは upstream で意図された挙動（jdx/mise#10999）なので待っても
# 直らない。壊れ方は 2 通り（mise 2026.8.12 で実測）:
#   - ツール名を指定した install → macOS 分が別エントリへ切り出され、エントリが 2 つになる
#   - 引数なしの install（`mise bootstrap` の実体）→ 逆に platform の checksum / URL が丸ごと消える
# lock の正は「エントリ 1 つ・mise.toml が宣言する platform が全部載っている」状態とし、
# `mise install` の後に出た lock の差分は `git checkout -- mise.lock` で捨てる。捨て忘れは
# scripts/check-mise-lock-platforms.sh が pre-commit と CI で止める。
# なお `mise lock --upgrade`（lockfile_version = 1）でもこの分裂は解消しない（実測）。
#
# バージョン更新時は version と 4 checksum を差し替えたうえで、
# `mise lock --platform linux-x64,linux-arm64,linux-x64-musl,linux-arm64-musl,macos-x64,macos-arm64 "http:kotlin-lsp"`
# で全 platform の checksum / URL を取得する（自ホスト分しか書き換わらない install と違い、
# このコマンドは 6 platform 分を揃えられる）。出力は上記のとおり 2 エントリになるので、
# 1 エントリへ手でまとめてからコミットする。
[tools."http:kotlin-lsp"]
version = "262.8190.0"
strip_components = 1
rename_exe = "kotlin-lsp"

[tools."http:kotlin-lsp".platforms.macos-x64]
url = "https://download-cdn.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.sit"
format = "zip"
checksum = "sha256:f3845ae9ee38c22ef5e436390d86a3d908f77073e9667fa643a5ae0957c19728"

[tools."http:kotlin-lsp".platforms.macos-arm64]
url = "https://download-cdn.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.sit"
format = "zip"
checksum = "sha256:e20183262784bb7e665ce1aea4855872a8b16f211ebb478d452773553732d9fb"

[tools."http:kotlin-lsp".platforms.linux-x64]
url = "https://download-cdn.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}.tar.gz"
checksum = "sha256:8b4c70e95065420e7867c99aaf9f18e0b4e76311ec453e4c1a39e3f6ae774cbf"

[tools."http:kotlin-lsp".platforms.linux-arm64]
url = "https://download-cdn.jetbrains.com/language-server/kotlin-server/{{version}}/kotlin-server-{{version}}-aarch64.tar.gz"
checksum = "sha256:c3edd59ef34a7faa4d04f3517afb7a932b19c3f9cf17d1a14e9da17b0b5440ad"
