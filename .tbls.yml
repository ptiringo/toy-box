# tbls 設定（#447）。DB スキーマから dbdoc/ を生成し、CI で diff/lint ゲートを敷く。
# DSN は generateDbDoc/checkDbDoc タスクが Testcontainers の接続情報から環境変数 TBLS_DSN で渡す。
# この設定ファイルは Gradle タスクが --config で明示的に読み込ませる（tbls 1.94.5 は cwd の
# .tbls.yml を自動探索しないため、build.gradle.kts から絶対パスを渡す）。
name: toy-box DB schema
dsn: ${TBLS_DSN}
docPath: dbdoc

# schema.json の出力を止める。tbls diff は Markdown のみ比較し schema.json を突き合わせない
# ため、driver.database_version（PG パッチ版・生成マシンの CPU アーキ amd64↔arm64 で変動）が
# 埋まった schema.json は CI に検知されず静かに drift する。ADR-0045 の「local==CI 出力一致」
# 方針に反するので、非決定的な schema.json は生成対象から外し Markdown だけを一次情報とする。
disableOutputSchema: true

er:
  format: mermaid

# flyway_schema_history は Flyway の内部管理テーブルで本ドメインのスキーマではない（V*.sql でも
# 作らない）。ドキュメント・lint の対象から外し、本来のドメインテーブルだけを一次情報として扱う。
exclude:
  - flyway_schema_history

# lint ルールは可能な限り有効化する方針（crit レビュー: 基本的に全て true）。
# ただし現スキーマに対して「違反ゼロで通せる」ものだけを true にする（CI の tbls lint ゲートを割らないため）。
# 残りは該当機能（ラベル / ビューポイント / index・制約コメント）を導入した時点で有効化する。
# 外部キーは ADR-0053 で導入済み。DB スキーマはコンテキスト別に分割済み（#569 / ADR-0048。studbook / racing）。
#
# 各ルールの注記には**有効化・無効化の理由だけ**を書き、対象の有無・件数・具体的な数値は書かない。
# 「対象ゼロ」を前提にした注記は対象が増えた瞬間に嘘になり、嘘になったことを誰も検知しない（#919）。
# 実際 requireTriggerComment の「トリガー未使用（対象ゼロ）」は、V23（#727 / ADR-0081）でトリガを
# 導入した後も残り、「このルールは今は何も見ていない」と読ませてコメント漏れの一往復を招いた（#906）。
lint:
  # コメント必須（スキーマを一次情報とする）。
  requireTableComment:
    enabled: true
  requireColumnComment:
    enabled: true
  requireTriggerComment:
    enabled: true # トリガーにもコメントを要求する（V23 の world_id イミュータブル化トリガが対象。ADR-0081）
  duplicateRelations:
    enabled: true # ADR-0053 で FK 導入済み。同一テーブル対の重複関連を検知する
  requireForeignKeyIndex:
    enabled: true # ADR-0053 で FK 導入済み。FK 列の index 有無を検査する
  labelStyleBigQuery:
    enabled: true # ラベルを導入したときの命名を BigQuery 準拠に固定する
  columnCount:
    enabled: true
    max: 50 # テーブルの肥大化を検知する。上限は緩めに設定
  # 以下は現スキーマだと違反が出て tbls lint が落ちるため、対応が済むまで無効（理由を明記）。
  unrelatedTable:
    enabled: true # 集約間 FK（ADR-0053）導入済み。関連を持たないテーブルの混入を検知する
    exclude:
      # スキーマ分割（#569 / ADR-0048）後、tbls はテーブルをスキーマ修飾名で扱うため
      # racing.jockey と完全修飾する（旧 public 単一スキーマ時代の bare 名 `jockey` は非マッチになる）。
      - racing.jockey # racing コンテキストの単一集約でコンテキスト内に関連先が無く構造的に unrelated（意図的）
  requireIndexComment:
    enabled: false # PK 由来の暗黙 index にコメントが無く落ちる（index コメント追加で有効化）
  requireConstraintComment:
    enabled: false # PK/CHECK 制約にコメントが無く落ちる（制約コメント追加で有効化）
  requireTableLabels:
    enabled: false # tbls ラベル未使用のため必須化すると落ちる（ラベル運用開始で有効化）
  requireViewpoints:
    enabled: false # ビューポイント未定義のため必須化すると落ちる（viewpoint 定義後に有効化）
  requireColumns:
    enabled: false # 全テーブル共通の必須列（created/updated 等）を定義していないため無効（定義したら有効化する）
