server:
  port: ${PORT:8080}

spring:
  application:
    name: api
  threads:
    virtual:
      enabled: true
  # ランタイムの永続化データソース。永続化実装は JDBC 一本に統一し（ADR-0030）、JDBC リポジトリが実際に
  # 読み書きする。datasource はここに既定値を置かず、実行環境が外部から供給する（H2 全面脱却・#451 / ADR-0044）:
  #   - 本番（Cloud Run）: Secret Manager から env（SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD）で
  #     Prisma Postgres（実 PostgreSQL v17）の接続情報を注入（deploy.yml の deploy-cloudrun secrets 入力）。
  #   - ローカル bootRun: spring-boot-docker-compose が compose.yaml の PostgreSQL を自動起動・自動配線。
  #   - テスト: Testcontainers の PostgreSQL を PostgresContainerSupport が注入。
  # driver-class-name は明示せず JDBC URL から導出させる（URL の差し替えだけで接続先を切り替えられる）。
  # 以下に置くのは接続先ではなく接続確立のタイムアウトだけで、上記の「既定値を置かない」方針は保つ。
  # 接続確立（TCP connect のあとの startup / 認証の応答待ち）に上限を掛ける（#818）。HikariCP の
  # connectionTimeout は本来「プールから接続を借りる待ち時間」で、接続確立そのものへは
  # DriverManager.setLoginTimeout() 経由でしか伝わらない。ところが pgjdbc は loginTimeout プロパティの
  # 既定値 "0" を先に読むため DriverManager の値へフォールバックせず、HikariCP の意図が届かない。
  # socketTimeout も既定 0（無制限）なので、詰まった DB に対して接続確立が**無限に待つ**（実測 402 秒
  # ブロックし pre-push が 7 分無反応になった）。そこで loginTimeout をドライバへ直接渡して届かせる。
  # loginTimeout は PostgreSQL ドライバのプロパティ（単位は秒）で、接続確立フェーズにのみ効く
  # （クエリの実行時間は切らない）。値は connection-timeout と揃える運用で、一致は
  # DataSourceLoginTimeoutTest が固定する。
  datasource:
    hikari:
      connection-timeout: 30000
      data-source-properties:
        loginTimeout: 30
  # マイグレーションは Flyway（plain SQL）。db/migration 配下の V*.sql を起動時に適用する。
  flyway:
    enabled: true
  jackson:
    # JSON ボディのフィールド名を snake_case で表現する（request/response bean に一括適用）。
    # URL=camelCase / ボディ=snake_case の命名規約は ADR-0012 を参照。
    # 注: ProblemDetail.properties は Map のため naming strategy が効かず、拡張キーは setProperty で個別に snake_case 指定する。
    property-naming-strategy: SNAKE_CASE
  ai:
    mcp:
      server:
        # MCP は開発者自身のローカル探索ツールであり、既定（本番 Cloud Run・CI・テスト）では口ごと開かない
        # （#712）。有効化は application-local.yml が担う。ツール Bean 側も @Profile("local") で二重に絞る。
        enabled: false
        name: toy-box-mcp
        version: 0.1.0
        # WebMVC の Streamable HTTP トランスポート。SSE/STATELESS も選べるが現行 MCP の標準は STREAMABLE。
        protocol: STREAMABLE
  mvc:
    problemdetails:
      # Spring MVC 標準例外（リクエストボディ不正・媒体型不一致等）を RFC 9457 形式に変換する
      enabled: true
  # OAuth2 リソースサーバとしての ID トークン（JWT）検証（ADR-0064）。認証は GCP Identity Platform に委譲する。
  # issuer は OIDC discovery（.well-known/openid-configuration）を公開しているため、issuer-uri 1 本で JWKS まで
  # 解決できる（jwk-set-uri の明示は不要）。audiences と併せて指定すると issuer 検証・audience 検証が自動で入る。
  # GCP_PROJECT_ID は秘密ではないため Secret Manager ではなく素の環境変数で供給する（本番は deploy.yml が注入）。
  # 既定値は意図的に実在しないプロジェクト ID にしてある。注入を忘れた環境では issuer が一致せず全トークンが
  # 401 になる（fail closed）。テストは HS256 の JwtDecoder Bean を定義して差し替えるため、この値を引かない。
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/${GCP_PROJECT_ID:gcp-project-id-not-injected}
          audiences: ${GCP_PROJECT_ID:gcp-project-id-not-injected}

springdoc:
  show-actuator: true

# Spring Boot Actuator の設定
management:
  endpoints:
    web:
      exposure:
        # セキュリティのため、ヘルスチェックエンドポイントのみ公開
        include: health
  endpoint:
    health:
      # 詳細な情報は認証された場合のみ表示（セキュリティ考慮）
      show-details: when-authorized
