# Lefthook の設定ファイル
# pre-commit hook を使用してコード品質をコミット前に確保する

pre-commit:
  parallel: true
  commands:
    # gitleaks によるシークレット混入チェック
    gitleaks:
      run: mise exec -- gitleaks git --pre-commit --staged --redact --no-banner
      tags: security

    # EditorConfig準拠チェック
    editorconfig-check:
      run: ec
      tags: format

    # ktfmt によるフォーマットチェック
    ktfmt-check:
      glob: "**/*.{kt,kts}"
      run: mise exec -- ./gradlew ktfmtCheck --daemon
      tags: format

    # detekt による静的解析
    detekt:
      glob: "**/*.{kt,kts}"
      run: mise exec -- ./gradlew detekt --daemon
      tags: lint

    # actionlint による GitHub Actions ワークフローの lint
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint
      tags: lint

    # zizmor による GitHub Actions ワークフローのセキュリティ監査
    zizmor:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- zizmor --offline --quiet .github/workflows/
      tags: security

    # ShellCheck によるシェルスクリプトの lint
    shellcheck:
      glob: "**/*.sh"
      run: mise exec -- shellcheck {staged_files}
      tags: lint

    # Terraform フォーマットチェック
    terraform-fmt-check:
      glob: "infra/*.tf"
      run: terraform fmt -check infra/
      tags: format

    # Terraform バリデーション
    terraform-validate:
      glob: "infra/*.tf"
      run: cd infra && terraform init -backend=false && terraform validate
      tags: lint

    # tflint による Terraform の lint（ADR-0017 / #377 フェーズ1: recommended preset）
    # mise 管理ツールの解決を確実にするため mise exec 経由で呼ぶ（gitleaks/actionlint/zizmor と同様）。
    tflint:
      glob: "infra/*.tf"
      run: cd infra && mise exec -- tflint --recursive
      tags: lint

    # Trivy による IaC セキュリティ misconfig スキャン（ADR-0017 / #378）。
    # mise 管理ツールの解決を確実にするため mise exec 経由で呼ぶ（tflint と同型）。
    # --exit-code 1: findings があればコミットをブロック（指定しないと findings があっても 0 を返す）。
    trivy-config:
      glob: "infra/*.tf"
      run: cd infra && mise exec -- trivy config . --exit-code 1 --quiet
      tags: security

    # dprint による設定ファイル（TOML/JSON/YAML）の整形チェック（ADR-0058 / #328）
    dprint:
      glob: "{,**/}*.{toml,json,jsonc,yml,yaml}"
      exclude:
        - ".devcontainer/devcontainer-lock.json"
      run: mise exec -- dprint check {staged_files}
      tags: format

    # sqlfluff による SQL の書式・スタイルチェック
    sqlfluff:
      glob: "**/*.sql"
      run: mise exec -- sqlfluff lint {staged_files}
      tags: format

    # squawk によるマイグレーション安全性チェック
    squawk:
      glob: "**/*.sql"
      run: mise exec -- squawk {staged_files}
      tags: lint

    # VALIDATE CONSTRAINT の別マイグレーション分離チェック（ADR-0052 / #539）。
    # 同一ファイルに ADD CONSTRAINT と VALIDATE CONSTRAINT が同居すると、Flyway の
    # 1 マイグレーション = 1 トランザクション適用下ではロック格下げが効かないため fail する。
    validate-constraint-separation:
      glob: "src/main/resources/db/migration/*.sql"
      run: scripts/check-migration-validate-separation.sh {staged_files}
      tags: lint

pre-push:
  commands:
    # プッシュ前に全体のテストを実行
    #
    # git worktree（リンクされた作業ツリー）では Gradle daemon を使わない（#482）。
    # Gradle daemon は永続・プロジェクト横断で共有され、起動時の作業ディレクトリ／書込権限
    # プロファイルを固定したまま再利用される。別コンテキスト（メインチェックアウト等）で
    # 起動済みの daemon が当 worktree の `.gradle` へ書き込めず、pre-push が即失敗することがある。
    # --no-daemon なら起動プロセス内でビルドが走り、この foreign daemon 再利用の非対称を回避する。
    # メインチェックアウト（`.git` がディレクトリ＝git-dir と git-common-dir が一致）では
    # 条件が偽となり、従来どおり daemon を使って高速化の恩恵を受ける。
    #
    # 上流根本原因: gradle/gradle#38054「Make the Gradle daemon sandbox-friendly」。
    # サンドボックスが $TMPDIR をセッション固有パスに書き換える環境で、起動コンテキストの
    # 異なる共有 daemon が当該セッションの書込先に到達できないことが本質。--no-daemon は
    # そこで挙げられた暫定回避策。将来 org.gradle.daemon.scope（キャッシュ共有のまま daemon を
    # スコープ分離）が実装されたら、性能を犠牲にしない形へ置き換えられる。
    full-test:
      glob: "**/*.{kt,kts,java}"
      run: mise exec -- ./gradlew test $([ "$(git rev-parse --git-common-dir)" != "$(git rev-parse --git-dir)" ] && echo --no-daemon)
      tags: test

commit-msg:
  commands:
    # コミットメッセージのフォーマットチェック（オプション）
    commitizen-check:
      run: |
        if ! echo "$(head -n1 {1})" | grep -E "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .{1,50}" > /dev/null; then
          echo "コミットメッセージは conventional commit 形式で記述してください"
          echo "例: feat: 新機能を追加"
          echo "例: fix: バグを修正"
          echo "例: docs: ドキュメントを更新"
          exit 1
        fi
      tags: commit-msg
