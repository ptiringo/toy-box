# Lefthook の設定ファイル
# pre-commit hook を使用してコード品質をコミット前に確保する

pre-commit:
  parallel: true
  commands:
    # gitleaks によるシークレット混入チェック
    gitleaks:
      run: mise exec -- gitleaks git --pre-commit --staged --redact --no-banner
      tags: security

    # EditorConfig準拠チェック
    editorconfig-check:
      run: ec
      tags: format

    # ktfmt によるフォーマットチェック
    # glob の `{,**/}` はルート直下と入れ子の両方に一致させるため（dprint と同じ理由。`**/*.{kt,kts}`
    # だとルート直下の build.gradle.kts / settings.gradle.kts が漏れ、ビルド構成だけを触った
    # コミットで ktfmt / detekt が 1 度も走らない。#800）。
    ktfmt-check:
      glob: "{,**/}*.{kt,kts}"
      run: mise exec -- ./gradlew ktfmtCheck --daemon
      tags: format

    # detekt による静的解析
    detekt:
      glob: "{,**/}*.{kt,kts}"
      run: mise exec -- ./gradlew detekt --daemon
      tags: lint

    # Biome による frontend の lint/フォーマットチェック
    # root を frontend に切ると、実行ディレクトリだけでなく {staged_files} も frontend/ からの
    # 相対パスへ書き換わる（cd するだけだと絶対パス化されない root 相対の staged_files が二重に
    # frontend/ を含んで解決できなくなる。実測で確認済み）。
    # glob の `{,**/}` は dprint と同じ理由。`frontend/**/*` だと frontend/ 直下の
    # vite.config.ts / biome.json / package.json が検査対象から漏れる（#800）。
    biome-frontend:
      root: "frontend/"
      glob: "frontend/{,**/}*.{ts,tsx,json}"
      run: npx biome check {staged_files}
      tags: lint

    # actionlint による GitHub Actions ワークフローの lint
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint
      tags: lint

    # zizmor による GitHub Actions ワークフローのセキュリティ監査
    zizmor:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- zizmor --offline --quiet .github/workflows/
      tags: security

    # ShellCheck によるシェルスクリプトの lint
    shellcheck:
      glob: "{,**/}*.sh"
      run: mise exec -- shellcheck {staged_files}
      tags: lint

    # Terraform フォーマットチェック
    # `-recursive` は CI（.github/workflows/terraform-check.yml）と揃えるため。付けないと
    # infra/ 直下しか見ず、infra/modules/** の整形崩れがローカルを素通りして CI で初めて落ちる（#793）。
    # なお glob の `infra/*.tf` は module 配下にも一致する（lefthook の `*` は `/` をまたぐ。
    # 一方 `**/` は 1 階層以上を要求する ＝ dprint / biome-frontend の `{,**/}` が要る理由。実測で確認済み）。
    terraform-fmt-check:
      glob: "infra/*.tf"
      run: terraform fmt -check -recursive infra/
      tags: format

    # Terraform バリデーション
    terraform-validate:
      glob: "infra/*.tf"
      run: cd infra && terraform init -backend=false && terraform validate
      tags: lint

    # tflint による Terraform の lint（ADR-0017 / #377 フェーズ1: recommended preset）
    # mise 管理ツールの解決を確実にするため mise exec 経由で呼ぶ（gitleaks/actionlint/zizmor と同様）。
    tflint:
      glob: "infra/*.tf"
      run: cd infra && mise exec -- tflint --recursive
      tags: lint

    # Trivy による IaC セキュリティ misconfig スキャン（ADR-0017 / #378）。
    # mise 管理ツールの解決を確実にするため mise exec 経由で呼ぶ（tflint と同型）。
    # --exit-code 1: findings があればコミットをブロック（指定しないと findings があっても 0 を返す）。
    trivy-config:
      glob: "infra/*.tf"
      run: cd infra && mise exec -- trivy config . --exit-code 1 --quiet
      tags: security

    # dprint による設定ファイル（TOML/JSON/YAML）の整形チェック（ADR-0063 / #328）
    # glob の `{,**/}` はルート直下と入れ子の両方に一致させるため（lefthook の `**/` は 1 階層以上を要求する）。
    # スコープの正は dprint.json の includes/excludes 側。ここでの exclude は devcontainer-lock.json のみ明示し、
    # 他の除外（build/**・.gradle/**・worktrees・settings.local.json）は gitignore と dprint.json が backstop する
    # （それら配下の追跡設定ファイルが将来 stage されると dprint が「No files found」で exit する余地がある点に留意）。
    dprint:
      glob: "{,**/}*.{toml,json,jsonc,yml,yaml}"
      exclude:
        - ".devcontainer/devcontainer-lock.json"
      run: mise exec -- dprint check {staged_files}
      tags: format

    # sqlfluff による SQL の書式・スタイルチェック
    sqlfluff:
      glob: "{,**/}*.sql"
      run: mise exec -- sqlfluff lint {staged_files}
      tags: format

    # squawk によるマイグレーション安全性チェック
    squawk:
      glob: "{,**/}*.sql"
      run: mise exec -- squawk {staged_files}
      tags: lint

    # VALIDATE CONSTRAINT の別マイグレーション分離チェック（ADR-0052 / #539）。
    # 同一ファイルに ADD CONSTRAINT と VALIDATE CONSTRAINT が同居すると、Flyway の
    # 1 マイグレーション = 1 トランザクション適用下ではロック格下げが効かないため fail する。
    validate-constraint-separation:
      glob: "src/main/resources/db/migration/*.sql"
      run: scripts/check-migration-validate-separation.sh {staged_files}
      tags: lint

pre-push:
  # piped: 先頭のコマンドが落ちたら後続を打ち切る（docker-available → full-test の順で fail fast）。
  piped: true

  # glob を当てる対象（push 予定の変更ファイル）を自前で供給する（#804）。
  # lefthook 既定の {push_files} は worktree で比較対象を取り違える。origin より前の名前を持つ
  # リモートが 1 つでもあると無関係な履歴との差分を返すため、.md だけの push でもほぼ全ファイルが
  # 「push 対象」と見なされ、下の glob が素通りする。取り違えの機序・切り分けの実測・この供給を
  # 残す理由は、スクリプト冒頭のコメントにある。
  files: scripts/list-push-target-files.sh

  commands:
    # Docker 到達性の事前確認（#679 / ADR-0071）。
    #
    # 後続の full-test は Testcontainers（PostgreSQL）に依存するため Docker デーモンを要求する。
    # デーモンが不調だと Testcontainers が接続を試み続けてテストが長時間ハングし、端末上は
    # 「push が無反応」に見えてネットワーク側を疑う切り分けに時間を取られる（実際 #365 の作業中に
    # 踏んだ）。ゲート自体は残したまま、テストを起動する前に到達性を確かめて理由と対処つきで
    # 即座に失敗させる。判定条件とタイムアウトの理由はスクリプト側のコメントに書いてある。
    #
    # glob は full-test と揃える（テストが走らない push で Docker を要求しない）。
    # priority で full-test より先に走らせる（lefthook の既定はコマンド名の辞書順）。
    docker-available:
      priority: 1
      glob: "{,**/}*.{kt,kts,java}"
      run: scripts/check-docker-available.sh
      tags: test

    # プッシュ前に全体のテストを実行
    #
    # git worktree（リンクされた作業ツリー）では Gradle daemon を使わない（#482）。
    # Gradle daemon は永続・プロジェクト横断で共有され、起動時の作業ディレクトリ／書込権限
    # プロファイルを固定したまま再利用される。別コンテキスト（メインチェックアウト等）で
    # 起動済みの daemon が当 worktree の `.gradle` へ書き込めず、pre-push が即失敗することがある。
    # --no-daemon なら起動プロセス内でビルドが走り、この foreign daemon 再利用の非対称を回避する。
    # メインチェックアウト（`.git` がディレクトリ＝git-dir と git-common-dir が一致）では
    # 条件が偽となり、従来どおり daemon を使って高速化の恩恵を受ける。
    #
    # 上流根本原因: gradle/gradle#38054「Make the Gradle daemon sandbox-friendly」。
    # サンドボックスが $TMPDIR をセッション固有パスに書き換える環境で、起動コンテキストの
    # 異なる共有 daemon が当該セッションの書込先に到達できないことが本質。--no-daemon は
    # そこで挙げられた暫定回避策。将来 org.gradle.daemon.scope（キャッシュ共有のまま daemon を
    # スコープ分離）が実装されたら、性能を犠牲にしない形へ置き換えられる。
    full-test:
      priority: 2
      glob: "{,**/}*.{kt,kts,java}"
      run: mise exec -- ./gradlew test $([ "$(git rev-parse --git-common-dir)" != "$(git rev-parse --git-dir)" ] && echo --no-daemon)
      tags: test

commit-msg:
  commands:
    # コミットメッセージのフォーマットチェック（オプション）
    #
    # マージ進行中（MERGE_HEAD が存在する）なら検査せず通す（#506）。`git merge` が生成する
    # 既定のメッセージ（`Merge branch 'origin/main' ...` / `Merge pull request #NNN ...`）は
    # Conventional Commits 形式ではないため、main 取り込みのたびに弾かれ `--no-verify` での
    # 回避（gitleaks 等の他フックまで一緒にスキップする）を誘発していた。
    # 個々のコミット履歴を main に残す merge commit 方針（CLAUDE.md）と整合させ、マージ
    # コミットだけを緩める。メッセージ本文ではなく MERGE_HEAD の有無で判定するので、
    # `Merge ` で始まる通常のコミットは従来どおり CC 形式を強制される。
    # `--git-path` を使うのは、リンクされた作業ツリー（git worktree）でも MERGE_HEAD の
    # 実パスを正しく解決するため。
    commitizen-check:
      run: |
        if [ -f "$(git rev-parse --git-path MERGE_HEAD)" ]; then
          exit 0
        fi
        if ! echo "$(head -n1 {1})" | grep -E "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .{1,50}" > /dev/null; then
          echo "コミットメッセージは conventional commit 形式で記述してください"
          echo "例: feat: 新機能を追加"
          echo "例: fix: バグを修正"
          echo "例: docs: ドキュメントを更新"
          exit 1
        fi
      tags: commit-msg
